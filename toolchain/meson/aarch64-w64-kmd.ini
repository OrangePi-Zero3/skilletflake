# SPDX-License-Identifier: MIT
# Meson cross file: ARM64 Windows kernel-mode (panwin.sys) with llvm-mingw on a Linux host.
#   meson setup build-kmd kmd --cross-file toolchain/meson/aarch64-w64-kmd.ini
# To use a different llvm-mingw, add a second cross file that only overrides [constants]:
#   [constants]
#   llvm = '/path/to/llvm-mingw'
# (meson merges cross files left to right).

[constants]
llvm = '/opt/llvm-mingw'
triple = 'aarch64-w64-mingw32'

[binaries]
c = llvm / 'bin' / (triple + '-clang')
ar = llvm / 'bin' / 'llvm-ar'
strip = llvm / 'bin' / 'llvm-strip'
lld-link = llvm / 'bin' / 'lld-link'
llvm-dlltool = llvm / 'bin' / 'llvm-dlltool'
llvm-readobj = llvm / 'bin' / 'llvm-readobj'

[properties]
needs_exe_wrapper = true
# mingw-w64 DDK headers (used after toolchain/include/ddk, which shadows wdm.h/ntddk.h).
mingw_ddk_include = llvm / triple / 'include' / 'ddk'

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'cortex-a76'
endian = 'little'
