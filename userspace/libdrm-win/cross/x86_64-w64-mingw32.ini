# SPDX-License-Identifier: MIT
# meson cross file: Windows x86_64 via llvm-mingw (/opt/llvm-mingw)
[binaries]
c = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-clang'
cpp = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-clang++'
ar = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-llvm-ar'
strip = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-strip'
windres = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-windres'
dlltool = '/opt/llvm-mingw/bin/x86_64-w64-mingw32-dlltool'
pkg-config = 'pkg-config'
exe_wrapper = 'wine'

[properties]
# Never pick up host (Linux) .pc files; build.sh adds the install prefix via a generated cross file.
pkg_config_libdir = []

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
