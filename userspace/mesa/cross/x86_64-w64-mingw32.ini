# SPDX-License-Identifier: MIT
# Meson cross file: Mesa (panvk) for Windows x86_64 with llvm-mingw.
# build.sh passes a generated "paths" cross file first, which defines the
# constants used here (llvm_mingw, panwin_compat_inc).

[binaries]
c = llvm_mingw / 'bin/x86_64-w64-mingw32-clang'
cpp = llvm_mingw / 'bin/x86_64-w64-mingw32-clang++'
ar = llvm_mingw / 'bin/x86_64-w64-mingw32-llvm-ar'
strip = llvm_mingw / 'bin/x86_64-w64-mingw32-strip'
windres = llvm_mingw / 'bin/x86_64-w64-mingw32-windres'
dlltool = llvm_mingw / 'bin/x86_64-w64-mingw32-dlltool'
pkg-config = 'pkg-config'

[built-in options]
# -mno-ms-bitfields: panfrost static-asserts GCC bitfield layouts (llvm-mingw
# defaults to the MS layout). Mesa's meson adds it too (patch 0007), keep it
# here so every TU, subprojects included, agree on struct layouts.
# panwin_compat_inc provides sys/ioccom.h for Mesa's drm-uapi/drm.h.
c_args = ['-mno-ms-bitfields', '-I' + panwin_compat_inc]
cpp_args = ['-mno-ms-bitfields', '-I' + panwin_compat_inc]

[properties]
# Never run cross-built tools during the build (wine binfmt would otherwise
# make meson try); host tools come from build.sh's native build.
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
